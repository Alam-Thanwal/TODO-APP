<!DOCTYPE html>
<html>
<head>
  <style>
    .scroll-box {
      width: 300px;
      height: 200px;
      border: 2px solid black;
      overflow-y: scroll; /* vertical scroll */
      overflow-x: hidden; /* horizontal hide */
    }
  </style>
</head>
<body>
  <h2>Scrollable Box Example</h2>
  <div class="scroll-box">
    <p>Line 1</p>
    <p>Line 2</p>
    <p>Line 3</p>
 
  </div>
</body>
</html>
