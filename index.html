<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>

    <div class="maindiv">
        <div class="box1" onclick="openframe()">
            <i class="add fa-solid fa-plus" style="color: #000000;"></i>
        </div>
        <div class="box2">
            <div class="column">
                <p class="heading">To DO</p>
                <div class="todo-list" id="todo-list"></div>
            </div>
            <div class="column">
                <p class="heading">In Progress</p>
                <div class="todo-list" id="in-progress"></div>
            </div>
            <div class="column">
                <p class="heading">Done</p>
                <div class="todo-list" id="done"></div>
            </div>

        </div>
    </div>
    </div>

    <div class="userinput">
        <i class="close fa-solid fa-xmark" style="color: #000000;" onclick="closeframe()"></i>
        <div class="input">
            <p class="inputhead">ADD NEW TO-DO</p>
            <input type="text" id="todo-input" placeholder="WRITE TO DO HERE"> <br>
            <button class="button-86" role="button" onclick="addTodo()">ADD TO-DO</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
